title: AWS CloudTrail or GuardDuty Disabled
id: d6933c5a-d216-4c14-b611-76c4b42d55da
status: test
description: |
  Detects successful API calls that stop or delete CloudTrail trails or GuardDuty detectors.
  Attackers do this right after gaining admin to blind defenders.
references:
  - https://attack.mitre.org/techniques/T1562/008/
author: Faris Elkhatib
date: 2026-11-23
tags:
  - attack.defense-evasion
  - attack.t1562.008
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_trail:
    eventSource: 'cloudtrail.amazonaws.com'
    eventName:
      - 'StopLogging'
      - 'DeleteTrail'
      - 'UpdateTrail'
  selection_gd:
    eventSource: 'guardduty.amazonaws.com'
    eventName:
      - 'DeleteDetector'
      - 'UpdateDetector'
  filter_failed:
    errorCode|exists: true
  condition: 1 of selection_* and not filter_failed
falsepositives:
  - Infrastructure-as-code changes to trail configuration (UpdateTrail). Correlate with deploy pipelines.
level: high
