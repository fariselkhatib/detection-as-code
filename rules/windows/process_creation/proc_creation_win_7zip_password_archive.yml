title: Password-Protected Archive Created With 7-Zip or WinRAR
id: 7c8a7165-a45b-4aac-becc-771de49d5707
status: test
description: |
  Detects creation of a password-protected archive from the command line, a common
  staging step before exfiltration. Interactive GUI use does not pass -p on the command
  line, so command-line archiving with a password is uncommon for normal users.
references:
  - https://attack.mitre.org/techniques/T1560/001/
author: Faris Elkhatib
date: 2026-11-23
tags:
  - attack.collection
  - attack.t1560.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_7z:
    Image|endswith:
      - '\7z.exe'
      - '\7za.exe'
      - '\7zr.exe'
    CommandLine|contains: ' a '
    CommandLine|re: '\s-p\S+'
  selection_rar:
    Image|endswith: '\rar.exe'
    CommandLine|contains: ' a '
    CommandLine|re: '\s-(hp|p)\S+'
  condition: 1 of selection_*
falsepositives:
  - Scripted backups or IT tooling that encrypts archives. Check the source paths being archived.
level: medium
